name: Kernel Uptime

on:
  schedule:
    # Runs at midnight 00:00 UTC every Friday
    # Thursday 6:00 PM CST/7:00 PM CDT
    - cron: '0 0 * * 5'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout your fork
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Add upstream and fetch
      run: |
        git remote add upstream https://github.com/torvalds/linux.git
        git fetch upstream

    - name: Merge upstream changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
 
        git merge upstream/master --no-commit --no-ff || echo "Merge prepared"
        if git ls-files -u | grep -v README > /dev/null; then
          git merge --abort
          echo "Conflicts beyond README detected - aborting"
          exit 1
        fi
        git checkout HEAD -- README README.md || true
        git rm --cached README README.md 2>/dev/null || true
        git add README* || true
        git commit -m "Sync upstream/master (preserve README at fork)" || echo "No changes to commit"

    - name: Push changes to fork
      run: |
        git push origin main
